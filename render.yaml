services:
  - type: web
    name: jungle-gaming-frontend
    runtime: node
    plan: free
    buildCommand: npm ci && VITE_ENABLE_MOCKS=true npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: VITE_API_BASE_URL
        value: /api
      - key: VITE_API_TIMEOUT
        value: "15000"
      - key: VITE_ENABLE_MOCKS
        value: "true"
      - key: VITE_DIAGNOSTICS
        value: "false"
